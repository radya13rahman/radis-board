<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>radi's board</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="nav-logo">
      <svg width="18" height="16" viewBox="0 0 18 16" fill="none" aria-hidden="true">
        <rect x="0"  y="0" width="7" height="7" rx="1.5" fill="#F48C65"/>
        <rect x="11" y="0" width="7" height="7" rx="1.5" fill="#0E0E0E"/>
        <rect x="0"  y="9" width="7" height="7" rx="1.5" fill="#0E0E0E"/>
        <rect x="11" y="9" width="7" height="7" rx="1.5" fill="#F48C65"/>
      </svg>
      <span class="logo-text">radi's board</span>
    </div>
    <div class="nav-filters" role="tablist" aria-label="Category filter">
      <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
      <span class="nav-dot" aria-hidden="true"></span>
      <button class="filter-btn" data-filter="remote-jobs" role="tab" aria-selected="false">Remote Jobs Source</button>
      <span class="nav-dot" aria-hidden="true"></span>
      <button class="filter-btn" data-filter="ai-tools" role="tab" aria-selected="false">AI Tools</button>
      <span class="nav-dot" aria-hidden="true"></span>
      <button class="filter-btn" data-filter="inspiration" role="tab" aria-selected="false">Inspiration</button>
    </div>
  </nav>

  <main class="main" id="main"></main>

  <footer class="footer">
    <span class="footer-brand">radi's board</span>
    <span class="footer-credit">Made with ♥ by radi &middot; <span id="footer-year"></span></span>
  </footer>

  <div class="panel-overlay" id="panelOverlay" aria-hidden="true"></div>
  <aside class="detail-panel" id="detailPanel" aria-label="Resource detail" aria-hidden="true">
    <button class="panel-close" id="panelClose" aria-label="Close panel">&times;</button>
    <div class="panel-content" id="panelContent"></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
