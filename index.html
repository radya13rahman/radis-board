<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rad's Insights</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="nav-logo">
      <span class="logo-text">Rad's Insights</span>
    </div>
    <div class="nav-filters" id="navFilters" role="tablist" aria-label="Category filter">
      <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
      <button class="filter-btn" data-filter="remote-jobs" role="tab" aria-selected="false">Remote Jobs Source</button>
      <button class="filter-btn" data-filter="ai-tools" role="tab" aria-selected="false">AI Tools</button>
      <button class="filter-btn" data-filter="inspiration" role="tab" aria-selected="false">Inspiration</button>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Hero Section -->
  <section class="hero" id="hero">
    <div class="hero-content">
      <p class="hero-eyebrow">Curated for Creators</p>
      <h1 class="hero-title">Find the tools<br>that <em>move</em> you</h1>
      <p class="hero-sub">Hand-picked AI tools, remote job sources, and inspiration — all in one place.</p>
      <a href="#main" class="hero-cta">Explore the board</a>
    </div>
    <div class="hero-3d" id="hero3d">
      <canvas id="coinCanvas"></canvas>
      <p class="hero-3d-hint">Drag to rotate</p>
    </div>
  </section>

  <main class="main" id="main"></main>

  <footer class="footer">
    <span class="footer-brand">Rad's Insights</span>
    <span class="footer-credit">Made with ♥ by radi &middot; <span id="footer-year"></span></span>
  </footer>

  <div class="panel-overlay" id="panelOverlay" aria-hidden="true"></div>
  <aside class="detail-panel" id="detailPanel" aria-label="Resource detail" aria-hidden="true">
    <button class="panel-close" id="panelClose" aria-label="Close panel">&times;</button>
    <div class="panel-content" id="panelContent"></div>
  </aside>

  <script src="app.js"></script>
  <!-- Three.js for 3D hero -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="hero3d.js"></script>
</body>
</html>
